name: MIRAI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check mirai tests
      - name: Test with coverage
        shell: bash
        run: |
          set -o pipefail
          pytest -q --cov=mirai --cov-report=term-missing 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 60 pytest-output.txt | while IFS= read -r line; do
              echo "::error title=Pytest output::$line"
            done
            exit "$status"
          fi
