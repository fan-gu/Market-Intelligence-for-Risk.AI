name: MIRAI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check mirai tests
      - name: Test audit
        run: python -m pytest -q tests/test_audit.py
      - name: Test risk service
        run: python -m pytest -q tests/test_risk_service.py
      - name: Test API
        run: python -m pytest -q tests/test_api.py
      - name: Test granular book risk
        run: python -m pytest -q tests/test_book_risk.py
      - name: Coverage report
        run: python -m pytest -q --cov=mirai --cov-report=term-missing